services:
  memedrop-server:
    container_name: memedrop-server-local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3010
    ports:
      - "${PORT:-3010}:3010"
    volumes:
      - ./releases/win-signed-v1:/updates/win-signed-v1:ro
      - ./releases/win:/updates/win:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
