name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build:app

      - name: Build server
        run: npm run build:server

      - name: Build website
        run: npm run build:web

      - name: Build protocol
        run: npm run build:protocol

      - name: Prepare Compose environment
        run: cp apps/server/.env.example apps/server/.env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container images
        run: |
          docker build --file apps/server/Dockerfile --tag memedrop-server:ci .
          docker build --file apps/web/Dockerfile --tag memedrop-web:ci .
