map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve Cloudflare's client IP header when that optional upstream is used;
# other deployments fall back to the direct peer address. Restrict this port to
# a trusted edge proxy whenever forwarded client addresses are relied upon.
map $http_cf_connecting_ip $memedrop_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

map $http_x_forwarded_proto $memedrop_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

# Reject encoded dot segments and path separators before Nginx normalizes the
# URI. Otherwise a malformed update path could fall through to the Vue SPA.
map $request_uri $memedrop_invalid_path {
    default 0;
    ~*^[^?]*(%2e|%5c) 1;
    ~*^([^?]*/)?\.\.?(/|%2f|\?|$) 1;
}

# Do not persist OAuth codes or state parameters in access logs.
log_format memedrop '$memedrop_client_ip - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log memedrop;

    if ($memedrop_invalid_path) {
        return 400;
    }

    # Docker's embedded resolver is queried at request time so Nginx remains
    # available while the backend is stopped or replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $memedrop_backend http://memedrop-server:3010;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health.json {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $memedrop_backend;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"backend_unavailable"}';
    }

    location = /auth/discord {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $memedrop_backend;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /auth/discord/ {
        # Nginx error messages include the raw request target. Keep OAuth
        # callback codes and state parameters out of routine upstream logs.
        error_log /var/log/nginx/error.log crit;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $memedrop_backend;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /ws {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $memedrop_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;
    }

    location = /updates/win-signed-v1 {
        return 404;
    }

    location ^~ /updates/win-signed-v1/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $memedrop_backend;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router uses history mode, so application routes fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
