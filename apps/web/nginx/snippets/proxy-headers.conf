proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $memedrop_forwarded_proto;
proxy_set_header X-Forwarded-Port $server_port;

# Never append client-supplied forwarding headers: the backend receives one
# address sourced from the local Cloudflare Tunnel, or the direct peer locally.
proxy_set_header X-Real-IP $memedrop_client_ip;
proxy_set_header X-Forwarded-For $memedrop_client_ip;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP "";
proxy_hide_header X-Content-Type-Options;

# Preserve the desktop client's authentication and version headers explicitly.
proxy_set_header Authorization $http_authorization;
proxy_set_header X-MemeDrop-Key $http_x_memedrop_key;
proxy_set_header X-MemeDrop-App-Version $http_x_memedrop_app_version;
proxy_set_header X-MemeDrop-OAuth-Poll-Token $http_x_memedrop_oauth_poll_token;
